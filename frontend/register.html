<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | GoodDeeds Campus</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-header"><nav class="nav container"><a class="brand" href="index.html">GoodDeeds<span>.</span></a><div class="nav-links"><a href="index.html">Home</a><a href="opportunities.html">Opportunities</a><span id="auth-nav"></span></div></nav></header>
<main class="container"><form class="form-card" id="auth-form" data-mode="register"><span class="eyebrow">Join the community</span><h1>Create account</h1><p class="muted">Start tracking the good you do.</p><div class="field"><label>Full name</label><input name="name" required maxlength="100" autocomplete="name"></div><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div><div class="field"><label>Password (minimum 8 characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn" type="submit">Create account</button><p class="muted">Already registered? <a href="login.html">Log in</a>.</p><div id="notice" class="notice" hidden></div></form></main>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script></body></html>
