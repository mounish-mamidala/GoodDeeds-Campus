<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | GoodDeeds Campus</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-header"><nav class="nav container"><a class="brand" href="index.html">GoodDeeds<span>.</span></a><div class="nav-links"><a href="index.html">Home</a><a href="opportunities.html">Opportunities</a><span id="auth-nav"></span></div></nav></header>
<main class="container" id="admin-root"><section class="page-hero"><span class="eyebrow">Manage the board</span><h1>Admin dashboard</h1><p class="muted">Create and maintain volunteering opportunities.</p></section><form class="form-card admin-form" id="op-form"><input type="hidden" name="id"><h2>Create / edit opportunity</h2><div class="field"><label>Title</label><input name="title" required maxlength="160"></div><div class="field"><label>Description</label><textarea name="description" required rows="4"></textarea></div><div class="form-grid"><div class="field"><label>Category</label><select name="category"><option>Environment</option><option>Education</option><option>Community</option><option>Health</option></select></div><div class="field"><label>Location</label><input name="location" required></div><div class="field"><label>Date</label><input name="event_date" type="date" required></div><div class="field"><label>Start time</label><input name="start_time" type="time"></div><div class="field"><label>Duration (hours)</label><input name="duration_hours" type="number" min=".5" step=".5" value="2" required></div><div class="field"><label>Available slots</label><input name="available_slots" type="number" min="0" value="10" required></div><div class="field"><label>Organizer</label><input name="organizer" value="GoodDeeds Campus"></div></div><div class="actions"><button class="btn" type="submit">Save opportunity</button><button class="btn secondary" type="button" id="reset-form">Clear</button></div><div id="notice" class="notice" hidden></div></form><section class="section"><h2>Existing opportunities</h2><div id="admin-list" class="admin-list"></div></section><section class="section"><h2>Student registrations</h2><p class="muted">Approve participation or mark completed activities and award hours.</p><div id="registration-list" class="admin-list"></div></section></main>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/admin.js"></script></body></html>
